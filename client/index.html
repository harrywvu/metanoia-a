<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Upload - VIBE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>Video Upload Form</h1>
            
            <form id="uploadForm" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="videoInput">Upload Video:</label>
                    <input 
                        type="file" 
                        id="videoInput" 
                        name="video" 
                        accept="video/*"
                        required
                    >
                    <span class="help-text">Maximum 30 MB, must be less than 10 seconds. Accepted: MP4, MOV, AVI, MKV (MP4 works best to avoid random issues).</span>
                </div>

                <div class="form-group">
                    <label for="genderSelect">Gender:</label>
                    <select id="genderSelect" name="gender" required>
                        <option value="">-- Select Gender --</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Upload</button>
            </form>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <div id="videoPreview" class="video-preview hidden">
                <h3>Video Details:</h3>
                <p><strong>File Name:</strong> <span id="previewFileName"></span></p>
                <p><strong>File Size:</strong> <span id="previewFileSize"></span></p>
                <p><strong>Duration:</strong> <span id="previewDuration"></span></p>
                <p><strong>Gender:</strong> <span id="previewGender"></span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
